<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<title>New Orleans — Avi &amp; Lilach</title>
<meta name="description" content="A mobile trip companion for New Orleans: maps, eat-safe restaurants, history & plans." />
<meta name="theme-color" content="#241f1a" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="favicon-32.png" sizes="32x32" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NOLA Guide" />
<!-- Leaflet is self-hosted in vendor/ and injected on demand (see ensureLeaflet).
     It used to be a render-blocking third-party <link>/<script> on every view, even
     though only the map screens need it. -->
<style>
  :root{
    --ink:#241b12; --paper:#f7f0e2; --paper2:#efe4cf; --card:#fffaef;
    --purple:#5b2a86; --green:#0a7d4c; --teal:#0b6e6e; --gold:#c9962f; --gold2:#a1751b;
    --wine:#8a2231; --iron:#241f1a; --eat:#c2571f; --skip:#9a4a44;
    --line:rgba(36,27,18,.14); --muted:#6a6153;
    --shadow:0 1px 2px rgba(36,27,18,.05),0 8px 22px rgba(36,27,18,.09);
    --topbar:56px; --tabbar:60px;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    color:var(--ink);background:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  }
  a{color:var(--purple);text-decoration:none}
  .serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}

  /* Top bar */
  #topbar{position:fixed;top:0;left:0;right:0;z-index:1000;height:calc(var(--topbar) + var(--safe-t));
    padding-top:var(--safe-t);background:var(--iron);color:#f4ead4;display:flex;align-items:center;
    gap:6px;padding-left:8px;padding-right:8px;border-bottom:1px solid rgba(201,150,47,.35)}
  #topbar .tb-btn{width:40px;height:40px;border:0;background:transparent;color:#f4ead4;font-size:22px;
    border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #topbar .tb-btn:active{background:rgba(255,255,255,.1)}
  #topbar .tb-title{flex:1;font-weight:700;font-size:17px;text-align:center;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  #topbar .tb-title small{display:block;font-weight:400;font-size:11px;color:var(--gold);letter-spacing:.04em}
  #backBtn[hidden]{visibility:hidden}

  /* View */
  #view{padding:calc(var(--topbar) + var(--safe-t) + 8px) 14px calc(var(--tabbar) + var(--safe-b) + 18px)}
  .view-map #view{padding:calc(var(--topbar) + var(--safe-t)) 0 0 0}

  /* Tab bar */
  #tabbar{position:fixed;bottom:0;left:0;right:0;z-index:1000;height:calc(var(--tabbar) + var(--safe-b));
    padding-bottom:var(--safe-b);background:var(--iron);display:flex;border-top:1px solid rgba(201,150,47,.35)}
  #tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:#b7ab90;font-size:10.5px;letter-spacing:.02em;text-decoration:none;padding-top:6px}
  #tabbar a .ic{font-size:20px;line-height:1}
  #tabbar a.on{color:var(--gold)}

  /* Building blocks */
  h1,h2,h3{margin:0}
  .sec-title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);
    font-weight:700;margin:18px 2px 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    overflow:hidden;margin-bottom:12px}
  .pad{padding:14px 16px}
  .row{display:flex;gap:10px;align-items:center}
  .muted{color:var(--muted)}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.03em;
    padding:3px 9px;border-radius:999px;background:var(--paper2);color:var(--ink);border:1px solid var(--line)}
  .chip.sm{font-size:10px;padding:2px 7px}
  .tag{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;
    padding:2px 7px;border-radius:999px}
  .t-book{background:var(--wine)} .t-free{background:var(--green)} .t-kosher{background:var(--teal)}
  .t-veg{background:#3f7d24} .t-star{background:#b8860b} .t-fish{background:var(--teal)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:600;
    padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);
    cursor:pointer;text-decoration:none}
  .btn.primary{background:var(--iron);color:#f7f0e2;border-color:var(--iron)}
  .btn.gold{background:var(--gold);color:#241f1a;border-color:var(--gold2)}
  .btn.block{display:flex;width:100%}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap}
  .star{background:transparent;border:0;font-size:22px;cursor:pointer;color:#c9b489;line-height:1;padding:2px}
  .star.on{color:#e0a92a}
  .pill-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
  .pill-scroll::-webkit-scrollbar{display:none}
  .filter{white-space:nowrap;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .filter.on{background:var(--iron);color:#f7f0e2;border-color:var(--iron)}
  .slot{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .slot:last-of-type{border-bottom:0}
  .slot.done .s-title,.slot.done .s-where{text-decoration:line-through;color:var(--muted)}
  .slot.star{background:linear-gradient(90deg,rgba(201,150,47,.10),transparent);border-radius:8px}
  .s-tick{flex:0 0 22px;width:22px;height:22px;margin-top:1px;border-radius:6px;cursor:pointer;
    border:1.5px solid var(--line);background:var(--card);color:var(--green);font-weight:800;font-size:13px;
    display:flex;align-items:center;justify-content:center;padding:0}
  .slot.done .s-tick{background:rgba(10,125,76,.12);border-color:rgba(10,125,76,.5)}
  .s-time{flex:0 0 52px;font-size:12px;font-weight:800;color:var(--gold2);padding-top:3px;letter-spacing:.01em}
  .s-body{flex:1;min-width:0}
  .s-title{font-size:14px;font-weight:600;line-height:1.35}
  .s-where{font-size:12px;color:var(--muted);margin-top:1px}
  .hop{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;margin:0 0 0 30px;padding:3px 0 5px;
    font-size:11.5px;color:var(--muted);border-left:2px dotted var(--line);padding-left:10px}
  .hop-ic{flex:0 0 auto;font-size:12px}
  .hop-m{flex:1 1 auto;min-width:0}
  .hop-m b{color:#7a5300}
  .hop.bad{border-left-color:rgba(154,74,68,.55)}
  .hop-w{flex:1 1 100%;color:var(--skip);font-weight:600;line-height:1.4}
  .tsum{margin-top:10px;padding:8px 10px;border-radius:10px;font-size:12px;font-weight:600;
    background:var(--paper2);border:1px solid var(--line);color:#3f382d}
  .tsum.bad{background:rgba(154,74,68,.08);border-color:rgba(154,74,68,.3)}
  .tsum-w{font-weight:600;color:var(--skip);font-size:11.5px;margin-top:3px}
  .s-note{font-size:12px;color:#3f382d;margin-top:3px;line-height:1.45}
  .s-cost{font-size:11.5px;color:#7a5300;font-weight:600;margin-top:2px}
  .s-warn{font-size:11.5px;color:var(--purple);font-weight:600;margin-top:3px;line-height:1.4}
  .s-act{flex:0 0 auto;display:flex;gap:3px}
  .btn.block{display:flex;width:100%}
  .pitem{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .pitem:last-child{border-bottom:0}
  .pitem.pick{cursor:pointer}
  .pi-ic{flex:0 0 20px;font-size:16px}
  .pi-b{flex:1;min-width:0}
  .pi-t{font-size:14px;font-weight:600;line-height:1.3}
  .pi-s{font-size:11.5px;color:var(--muted);margin-top:1px}
  .pi-a{flex:0 0 auto;display:flex;gap:4px}
  .pbtn{width:30px;height:30px;border:1px solid var(--line);background:var(--paper2);border-radius:8px;
    font-size:14px;line-height:1;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .pbtn[disabled]{opacity:.3}
  .pbtn.del{color:var(--skip)}
  .pbtn.add{background:var(--gold);border-color:var(--gold2);font-weight:700}
  .dots{display:inline-flex;gap:2.5px;align-items:center;flex:0 0 auto}
  .dot{width:6px;height:6px;border-radius:50%;background:rgba(36,27,18,.18)}
  .dot.on{background:var(--green)}
  .optline{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:#0a7d4c;font-weight:600}
  .optbox{display:flex;align-items:center;gap:10px;margin:8px 0 2px;padding:8px 10px;border-radius:10px;
    background:rgba(10,125,76,.08);border:1px solid rgba(10,125,76,.25);font-size:13px}
  .optbox b{color:#0a7d4c}
  .wx{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;border-radius:10px;
    background:rgba(91,42,134,.07);border:1px solid rgba(91,42,134,.2);font-size:12.5px;line-height:1.45;color:#3f2758}
  .wx .wx-t{font-weight:800;font-size:15px;color:var(--ink);flex:0 0 auto}
  .wx .wx-p{font-weight:700;color:var(--purple)}
  .wx.wet{background:rgba(91,42,134,.13);border-color:rgba(91,42,134,.38)}
  .srcline{font-size:12px;line-height:1.45;margin:-2px 2px 8px;color:#20443f}
  .srcline b{font-weight:700}
  .srcline.approx{color:#6b3410}
  .daybox{margin-top:8px;padding:8px 10px;border-radius:10px;font-size:13px;line-height:1.5;
    background:rgba(11,110,110,.10);border:1px solid rgba(11,110,110,.28);color:#20443f}
  .daybox b{color:#0b6e6e}
  .daybox.hot{background:rgba(194,87,31,.10);border-color:rgba(194,87,31,.30);color:#6b3410}
  .daybox.hot b{color:#c2571f}
  .daybox.wet{background:rgba(91,42,134,.09);border-color:rgba(91,42,134,.26);color:#3f2758}
  .daybox.wet b{color:#5b2a86}
  .leg{display:flex;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .leg:last-of-type{border-bottom:0}
  .leg-ic{flex:0 0 20px;font-size:15px;line-height:1.4}
  .leg-b{flex:1;min-width:0}
  .leg-t{font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
  .leg-cost{flex:0 0 auto;font-weight:700;color:#7a5300;font-size:12.5px;white-space:nowrap}
  .leg-d{font-size:12px;color:var(--muted);margin-top:1px}
  .upd-banner{position:fixed;left:10px;right:10px;z-index:1200;
    bottom:calc(var(--tabbar) + var(--safe-b) + 10px);
    background:var(--iron);color:#f7f0e2;border:1px solid var(--gold2);border-radius:14px;
    box-shadow:0 6px 24px rgba(36,27,18,.35);padding:10px 12px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
  .filt-lbl{align-self:center;flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--gold2);padding-right:2px}
  .pill-scroll .filt-lbl:first-child{padding-left:2px}

  /* hero */
  .hero{border-radius:18px;color:#fdf6e6;padding:18px 16px;margin-bottom:12px;position:relative;overflow:hidden;
    background:linear-gradient(150deg,rgba(24,15,36,.94),rgba(10,44,30,.9)),
      repeating-linear-gradient(45deg,rgba(201,150,47,.10) 0 20px,transparent 20px 40px),var(--iron)}
  .hero h1{font-size:26px;font-weight:800}
  .hero .kick{color:var(--gold);font-size:11px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:6px}
  .hero .sub{color:#eadfca;font-size:14px;margin-top:4px}
  .count{font-size:13px;background:rgba(255,250,239,.12);border:1px solid rgba(201,150,47,.35);
    border-radius:12px;padding:8px 12px;margin-top:12px;color:#f4ecd8}

  .eatline{background:rgba(11,110,110,.14);border:1px solid rgba(11,110,110,.4);border-radius:12px;
    padding:10px 12px;font-size:13px;color:#20443f;margin-bottom:12px}
  .eatline b{color:#0b6e6e}
  .eatline .no{color:var(--skip)}

  /* list rows */
  .rowcard{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:10px;cursor:pointer}
  .rowcard .thumb{width:96px;min-height:96px;flex:0 0 96px;background:var(--paper2);position:relative;
    background-size:cover;background-position:center}
  .rowcard .thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px}
  .rowcard .thumb .thumb-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .rowcard .body{flex:1;padding:10px 12px;min-width:0}
  .rowcard .body h3{font-size:16px;font-weight:700;line-height:1.2}
  .rowcard .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .rowcard .vibe{font-size:13px;margin-top:5px;color:#3f382d;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  .rating{font-weight:700;color:#8a5a00}
  .price{color:var(--muted)}
  .fav-abs{position:absolute;top:4px;right:4px}

  /* detail */
  .cover{height:200px;background:var(--paper2);background-size:cover;background-position:center;position:relative;
    border-radius:16px;overflow:hidden;margin-bottom:12px;display:flex;align-items:flex-end}
  .cover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px;
    background:linear-gradient(150deg,var(--purple),var(--green))}
  .cover .grad{position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.55))}
  .cover .cap{position:relative;color:#fff;padding:14px;z-index:1}
  .cover .cap h1{font-size:24px;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.5)}
  .cover .cap .m{font-size:13px;opacity:.95}

  .menuwrap{border:1px dashed var(--line);border-radius:14px;padding:6px 14px;background:#fffdf7}
  .menu-item{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .menu-item:last-child{border-bottom:0}
  .menu-item .mi-name{font-weight:600}
  .menu-item .mi-note{font-size:12px;color:var(--muted)}
  .menu-item .mi-price{font-weight:700;color:#7a5300;white-space:nowrap}
  .skipbox{background:rgba(154,74,68,.08);border:1px solid rgba(154,74,68,.25);border-radius:10px;
    padding:8px 12px;font-size:13px;color:var(--skip);margin-top:10px}

  .fact{display:flex;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .fact:last-child{border-bottom:0}
  .fact .b{color:var(--gold2);font-size:15px}
  details.more{margin-top:8px}
  details.more summary{cursor:pointer;color:var(--purple);font-weight:600;font-size:14px;list-style:none}
  details.more summary::-webkit-details-marker{display:none}

  .minimap{height:160px;border-radius:14px;overflow:hidden;margin:4px 0 12px;border:1px solid var(--line)}
  #bigmap{position:absolute;top:calc(var(--topbar) + var(--safe-t) + 46px);left:0;right:0;
    bottom:calc(var(--tabbar) + var(--safe-b));width:100%}
  .mapbar{position:fixed;top:calc(var(--topbar) + var(--safe-t));left:0;right:0;z-index:600;
    background:var(--paper);padding:6px 10px;border-bottom:1px solid var(--line)}
  .map-fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;
    min-height:150px;text-align:center;color:var(--muted);font-size:26px;padding:20px;line-height:1.6}
  .map-fallback br+*{font-size:14px}

  .walk-stop{display:flex;gap:12px;padding:8px 0}
  .walk-stop .num{flex:0 0 24px;height:24px;border-radius:50%;background:var(--gold);color:#241f1a;
    font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
  .walk-stop .wl{font-size:14px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
  .qcard .qic{font-size:24px}
  .qcard .qt{font-weight:700;font-size:15px}
  .qcard .qs{font-size:12px;color:var(--muted)}

  .check{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line)}
  .check:last-child{border-bottom:0}
  .check input{width:22px;height:22px;accent-color:var(--green);flex:0 0 auto}
  .check .ck-b{font-weight:600}
  .check.done .ck-b{text-decoration:line-through;color:var(--muted)}
  .check .ck-s{font-size:12px;color:var(--muted)}

  .searchbar{display:flex;gap:8px;margin-bottom:10px}
  .searchbar input{flex:1;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--card)}
  .empty{text-align:center;color:var(--muted);padding:40px 20px}

  .budget-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}
  .budget-row.total{font-weight:800;border-bottom:0;font-size:17px}
  .leaflet-popup-content{margin:10px 12px;font-size:14px}
  .leaflet-popup-content .pp-t{font-weight:700}
  .leaflet-popup-content a{font-weight:600}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="tb-btn" id="backBtn" aria-label="Back" hidden>‹</button>
    <div class="tb-title" id="title">New Orleans</div>
    <button class="tb-btn" id="searchBtn" aria-label="Search" data-nav="#/search">⌕</button>
  </header>

  <main id="view"></main>

  <nav id="tabbar">
    <a data-nav="#/" data-tab="home"><span class="ic">🏠</span>Home</a>
    <a data-nav="#/map" data-tab="map"><span class="ic">🗺️</span>Map</a>
    <a data-nav="#/eat" data-tab="eat"><span class="ic">🍽️</span>Eat</a>
    <a data-nav="#/do" data-tab="do"><span class="ic">🎭</span>Do</a>
    <a data-nav="#/plan" data-tab="plan"><span class="ic">🗓️</span>Plan</a>
    <a data-nav="#/more" data-tab="more"><span class="ic">☰</span>More</a>
  </nav>
</div>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  var DATA = window.DATA || {};
  var view = document.getElementById('view');
  var titleEl = document.getElementById('title');
  var backBtn = document.getElementById('backBtn');
  var liveMaps = [];
  var mapGen = 0;   // bumped on every route change; stale async map mounts bail out

  // ---------- helpers ----------
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function el(id){return document.getElementById(id);}
  function clearMaps(){mapGen++;liveMaps.forEach(function(m){try{m.remove();}catch(e){}});liveMaps=[];}
  var CATCOLOR={eat:'#c2571f',see:'#5b2a86',landmark:'#5b2a86',music:'#8a2231',museum:'#a1751b',
    park:'#0a7d4c',shop:'#0b6e6e'};
  function catColor(c){return CATCOLOR[c]||'#5b2a86';}
  function mapsUrl(p){return p.mapsUrl||('https://www.google.com/maps/search/?api=1&query='+
    (p.lat&&p.lng?p.lat+','+p.lng:encodeURIComponent(p.name+' New Orleans')));}
  function dirUrl(p){return 'https://www.google.com/maps/dir/?api=1&destination='+
    (p.lat&&p.lng?p.lat+','+p.lng:encodeURIComponent(p.name+' New Orleans'));}

  // data access
  function restaurants(){return DATA.restaurants||[];}
  function sights(){return DATA.sights||[];}
  function districts(){return DATA.districts||[];}
  function allPlaces(){
    return restaurants().map(function(r){return Object.assign({type:'r',category:'eat'},r);})
      .concat(sights().map(function(s){return Object.assign({type:'s'},s);}));
  }
  function findR(id){return restaurants().filter(function(x){return x.id===id;})[0];}
  function findS(id){return sights().filter(function(x){return x.id===id;})[0];}

    if(/coffee|café au lait|cafe au lait|tea|juice|soda|lemonade|milk|pimm|cocktail|sazerac|daiquiri/.test(s))return 'drink';

  // ---------- the schedule: curated, but yours to change ----------
  // Curated slots live in DATA.schedule. The moment you edit a day, that day is copied

  var KIND_ICON={travel:'🚕',food:'🍽️',sight:'📸',music:'🎷',event:'🎉',rest:'😌',tour:'🎟️',admin:'🧾'};
  function curatedFor(day){return (DATA.schedule||[]).filter(function(s){return s.day===day;});}
  function schedEdits(){return ls('nola_sched',{});}
  function saveSchedEdits(o){localStorage.setItem('nola_sched',JSON.stringify(o));}

  // Which day to lead with: today if we're mid-trip, otherwise the first day

    for(var i=0;i<days.length;i++){

  // ---- live transit between whatever order the slots are actually in ----
  function baseLoc(){var b=DATA.base;return (b&&typeof b.lat==='number')?{lat:b.lat,lng:b.lng}:null;}
  // An explicit location if the slot has one; null means "wherever you already are".
  function ownLoc(s){
    if(!s)return null;
    if(typeof s.lat==='number'&&typeof s.lng==='number')return {lat:s.lat,lng:s.lng};
    if(s.nav){
      var m=/^#\/(r|s)\/(.+)$/.exec(s.nav);
      if(m){var o=(m[1]==='r')?findR(m[2]):findS(m[2]);
        if(o&&typeof o.lat==='number')return {lat:o.lat,lng:o.lng};}
    }
    // only these actually put you back at the hotel
    if(/hotel|check ?in|check ?out|pool|bags/i.test((s.title||'')+' '+(s.where||'')))return baseLoc();
    return null;

  // Resolve the whole day at once: an unlocated slot (a sit-down, a generic lunch)
  // stays where you already were rather than inventing a trip back to the hotel.
  function resolveLocs(slots){
    var out=[],carry=baseLoc();
    for(var i=0;i<slots.length;i++){

  function milesBetween(a,b){
    var R=3958.8,rad=function(x){return x*Math.PI/180;};

    var h=Math.sin(dLat/2)*Math.sin(dLat/2)+
      Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)*Math.sin(dLon/2);

    var walk=Math.max(1,Math.round(mi*22));
    var t1=minsOf(prev.time),t2=minsOf(next.time);
    var gap=(t1!=null&&t2!=null&&t2>=t1)?(t2-t1):null;
    var hour=parseInt(String(next.time||'12:00').split(':')[0],10);
    var hot=hour>=11&&hour<16;

    else {icon='🚗';mode='too far to walk ('+walk+' min)';

    var warns=[];
    if(gap!=null&&mi>0.15&&gap<walk+5)
      warns.push('only '+gap+' min between these, and the hop alone is '+walk+' min');
    if(hot&&mi>0.6)warns.push('11am–4pm heat — '+walk+' min on foot will hurt');

  function hopRow(prev,next,A,B){

        (h.cost?' · <b>'+esc(h.cost)+'</b>':'')+'</span>'+
      (h.warns.length?'<span class="hop-w">⚠ '+esc(h.warns.join(' · '))+'</span>':'')+
    '</div>';
  }
  // recomputed every render, so it always matches the current order
  function dayTransit(slots){
    var walkMi=0,lo=0,hi=0,rides=0,warns=0;
    var L=resolveLocs(slots);
    for(var i=1;i<slots.length;i++){
      var h=hopInfo(slots[i-1],slots[i],L[i-1],L[i]);
      if(!h)continue;
      warns+=h.warns.length?1:0;
      if(h.ride){rides++;
        var m=/\$(\d+)–(\d+)/.exec(h.cost||'');
        if(m){lo+=+m[1];hi+=+m[2];}
      } else walkMi+=h.mi;
    }
    return {walkMi:walkMi,lo:lo,hi:hi,rides:rides,warns:warns};
  }
  function transitSummary(slots){
    var t=dayTransit(slots);
    if(!t.walkMi&&!t.rides)return '';
    var bits=[];
    if(t.walkMi)bits.push('🚶 '+t.walkMi.toFixed(1)+' mi on foot');
    if(t.rides)bits.push('🚗 '+t.rides+' ride'+(t.rides===1?'':'s')+
      (t.hi?' · $'+t.lo+'–'+t.hi:''));
    return '<div class="tsum'+(t.warns?' bad':'')+'">'+esc(bits.join('  ·  '))+
      (t.warns?'<div class="tsum-w">'+t.warns+(t.warns===1?' hop needs':' hops need')+
        ' a look — see the ⚠ above</div>':'')+'</div>';
  }

  function scheduleTeaser(){

    var now=new Date();
    // show from the next thing onward when we're actually on that day
    var iso=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    var onDay=(curatedFor(day)[0]||{}).when&&String(curatedFor(day)[0].when).slice(0,10)===iso;
    var start=0;
    if(onDay){
      var hhmm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
      for(var i=0;i<slots.length;i++){if((slots[i].time||'')>=hhmm){start=Math.max(0,i-1);break;}}
    }

  // ---------- editable itinerary ----------
  // Stored in localStorage as { Fri:[{t:'r'|'s'|'t'|'e', id}], ... }. Empty until you
  // add something, so the curated plan above stays the default view.
  var DAYKEYS=['Fri','Sat','Sun','Mon'];
  function plan(){return ls('nola_plan',{});}
  function savePlan(p){localStorage.setItem('nola_plan',JSON.stringify(p));}
  function planFor(day){var p=plan();return (p[day]||[]).slice();}
  function planAdd(day,t,id){
    var p=plan();if(!p[day])p[day]=[];
    if(!p[day].some(function(x){return x.t===t&&x.id===id;}))p[day].push({t:t,id:id});
    savePlan(p);
  }
  function planRemove(day,i){var p=plan();if(!p[day])return;p[day].splice(i,1);savePlan(p);}
  function planMove(day,i,dir){
    var p=plan();var a=p[day];if(!a)return;var j=i+dir;
    if(j<0||j>=a.length)return;var tmp=a[i];a[i]=a[j];a[j]=tmp;savePlan(p);
  }
  function planCount(){var p=plan();return DAYKEYS.reduce(function(a,d){return a+((p[d]||[]).length);},0);}
  function lookup(t,id){
    if(t==='r')return findR(id);
    if(t==='s')return findS(id);
    if(t==='t')return (DATA.tours||[]).filter(function(x){return x.id===id;})[0];
    if(t==='e')return (DATA.events||[]).filter(function(x){return x.id===id;})[0];
    return null;
  }

    if(t==='r')return (o.cuisine||'')+' · '+(o.area_label||dName(o.district)||'');

      if(dist!=='all'&&r.district!==dist)return false;

  // Force-refresh: drop every cache, nudge the service worker, reload from network.
  function hardRefresh(btn){
    if(btn){btn.textContent='Refreshing…';btn.disabled=true;}
    var jobs=[];
    if(window.caches&&caches.keys){
      jobs.push(caches.keys().then(function(keys){
        return Promise.all(keys.map(function(k){return caches.delete(k);}));}).catch(function(){}));
    }
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(regs){
        return Promise.all(regs.map(function(r){return r.update().catch(function(){});}));}).catch(function(){}));
    }
    Promise.all(jobs).then(function(){
      // cache-busted reload so even a stale HTTP cache can't win
      var u=location.pathname+'?r='+Date.now()+location.hash;
      location.replace(u);
    }).catch(function(){location.reload();});
  }

        (p.tags||[]).join(' ')+' '+(p.category||'')).toLowerCase();
      return hay.indexOf(q)>=0;});
    box.innerHTML = items.length?items.slice(0,40).map(rowCard).join(''):'<div class="empty">Nothing found.</div>';
  }

  function favoritesView(){
    var ids=favs();var items=allPlaces().filter(function(p){return ids.indexOf(p.id)>=0;});
    if(!items.length)return '<div class="sec-title" style="margin-top:6px">Favorites</div>'+
      '<div class="empty">Tap ☆ on any place to save it here.</div>';
    var mapped=items.filter(function(p){return p.lat&&p.lng;});
    if(mapped.length)setTimeout(function(){mountMap('favmap',[29.958,-90.064],13,mapped);},0);
    return '<div class="sec-title" style="margin-top:6px">Favorites ('+items.length+')</div>'+
      (mapped.length?'<div class="minimap" id="favmap" style="height:190px"></div>':'')+
      items.map(rowCard).join('');
  }
  function notFound(){return '<div class="empty">Not found. <span class="btn" data-nav="#/">Home</span></div>';}

  // ---------- router ----------
  var TABS={'':'home','map':'map','eat':'eat','do':'do','plan':'plan','more':'more'};
  function parseQuery(s){var o={};(s||'').split('&').forEach(function(kv){if(!kv)return;var p=kv.split('=');
    o[decodeURIComponent(p[0])]=decodeURIComponent(p[1]||'');});return o;}
  function router(){
    clearMaps();
    var raw=location.hash.replace(/^#\/?/,'');
    var q={};var qi=raw.indexOf('?');if(qi>=0){q=parseQuery(raw.slice(qi+1));raw=raw.slice(0,qi);}
    var parts=raw.split('/');var route=parts[0]||'';var arg=parts[1]||'';
    var titleHTML='New Orleans', back=true, html='';
    if(route===''){html=homeView();titleHTML='New Orleans <small>Jul 31 – Aug 3</small>';back=false;}
    else if(route==='map'){html=mapView(q);titleHTML='Map';back=false;}
    else if(route==='eat'){html=eatView(q);titleHTML='Where to eat';back=false;}
    else if(route==='do'){html=doView(q);titleHTML='Things to do';back=false;}
    else if(route==='whatson'){html=whatsOnView();titleHTML='What’s on';back=false;}
    else if(route==='getting-around'){html=logisticsView();titleHTML='Getting around';back=true;}
    else if(route==='itinerary'){html=itineraryView(q);titleHTML='My plan';back=true;}
    else if(route==='schedule'){html=scheduleView(q);titleHTML='Schedule';back=true;}
    else if(route==='plan'){html=planView();titleHTML='Plan';back=false;}
    else if(route==='more'){html=moreView();titleHTML='More';back=false;}
    else if(route==='r'){var rr=findR(arg);html=restaurantView(arg);titleHTML=esc(rr?rr.name:'Not found');}
    else if(route==='s'){var ss=findS(arg);html=sightView(arg);titleHTML=esc(ss?ss.name:'Not found');}
    else if(route==='d'){var dd0=findD(arg);html=districtView(arg);titleHTML=esc(dd0?dd0.name:'Not found');}
    else if(route==='satchmo'){html=satchmoView();titleHTML='Satchmo';back=true;}
    else if(route==='search'){html=searchView();titleHTML='Search';back=true;}
    else if(route==='favorites'){html=favoritesView();titleHTML='Favorites';back=true;}
    else {html=notFound();titleHTML='New Orleans';}

    document.body.className = route==='map'?'view-map':'';
    view.innerHTML=html;
    titleEl.innerHTML=titleHTML;
    backBtn.hidden=!back;
    // active tab
    [].forEach.call(document.querySelectorAll('#tabbar a'),function(a){
      a.classList.toggle('on',a.getAttribute('data-tab')===(TABS[route]||''));});
    window.scrollTo(0,0);

    // post-mount
    if(el('mini')){var pm=findR(arg)||findS(arg);var dd=findD(arg);
      if(pm&&pm.lat)mountMap('mini',[pm.lat,pm.lng],15,[Object.assign({type:(route==='r'?'r':'s')},pm)]);
      else if(dd)mountMap('mini',[dd.center_lat||29.958,dd.center_lng||-90.064],dd.zoom||14,
        allPlaces().filter(function(p){return p.district===dd.id;}));}
    if(route==='search'){var qi2=el('q');if(qi2){qi2.addEventListener('input',function(){runSearch(qi2.value);});
      runSearch('');qi2.focus();}}
    // itinerary picker: filter in place, without re-navigating on every keystroke
    if(route==='schedule'&&q.add){var sq=el('sq');
      if(sq){sq.addEventListener('input',function(){
        var box=el('sres');if(box)box.innerHTML=schedPicker(q.add,sq.value.trim().toLowerCase());});
        sq.focus();}}
    if(route==='itinerary'&&q.add){var pq=el('pq');
      if(pq){pq.addEventListener('input',function(){
        var box=el('pres');if(box)box.innerHTML=pickerResults(q.add,pq.value.trim().toLowerCase());});
        if(q.q)pq.setSelectionRange(pq.value.length,pq.value.length);
        pq.focus();}}
  }

  // ---------- events ----------
  function navigate(h){if(location.hash===h){router();}else{location.hash=h;}}
  document.addEventListener('click',function(e){
    var chk=e.target.closest&&e.target.closest('[data-check]');
    if(chk&&e.target.tagName==='INPUT'){setCheck(chk.getAttribute('data-check'),e.target.checked);
      var lab=e.target.closest('.check');if(lab)lab.classList.toggle('done',e.target.checked);return;}
    var fav=e.target.closest&&e.target.closest('[data-fav]');
    if(fav){e.preventDefault();e.stopPropagation();toggleFav(fav.getAttribute('data-fav'));
      // update just this star + any duplicates
      var id=fav.getAttribute('data-fav');var on=isFav(id);
      [].forEach.call(document.querySelectorAll('[data-fav="'+id.replace(/"/g,'')+'"]'),function(b){
        b.classList.toggle('on',on);b.textContent=on?'★':'☆';});return;}
    // --- schedule edits ---
    var sd=e.target.closest&&e.target.closest('[data-sdone]');
    if(sd){e.preventDefault();e.stopPropagation();
      var k=sd.getAttribute('data-sdone').split('|');
      toggleDone(k[0],{time:k[1],title:k[2]});router();return;}
    var sm=e.target.closest&&e.target.closest('[data-smove]');
    if(sm){e.preventDefault();e.stopPropagation();
      var a=sm.getAttribute('data-smove').split(':');var day=a[0],i=+a[1],dir=+a[2];
      schedMutate(day,function(arr){var j=i+dir;if(j<0||j>=arr.length)return;
        var t=arr[i];arr[i]=arr[j];arr[j]=t;});
      router();return;}
    var sdr=e.target.closest&&e.target.closest('[data-sdrop]');
    if(sdr){e.preventDefault();e.stopPropagation();
      var b=sdr.getAttribute('data-sdrop').split(':');
      schedMutate(b[0],function(arr){arr.splice(+b[1],1);});router();return;}
    var srs=e.target.closest&&e.target.closest('[data-sreset]');
    if(srs){e.preventDefault();e.stopPropagation();
      schedReset(srs.getAttribute('data-sreset'));router();return;}
    var sad=e.target.closest&&e.target.closest('[data-sadd]');
    if(sad){e.preventDefault();e.stopPropagation();
      var c=sad.getAttribute('data-sadd').split(':');var day2=c[0],t2=c[1],id2=c.slice(2).join(':');
      var o=lookup(t2,id2);if(!o)return;
      var when=window.prompt('What time on '+day2+'? (24h, e.g. 14:30)','');
      if(when===null)return;
      when=(when||'').trim();
      if(!/^\d{1,2}:\d{2}$/.test(when))when='12:00';
      if(when.length===4)when='0'+when;
      var base=(curatedFor(day2)[0]||{}).when||'';
      schedMutate(day2,function(arr){
        arr.push({day:day2,when:base.slice(0,10)+'T'+when,time:when,
          title:(o.name||o.title||'Something'),where:itemSub(t2,o),
          kind:t2==='r'?'food':(t2==='e'?'event':(t2==='t'?'tour':'sight')),
          nav:itemNav(t2,o)||undefined});
        arr.sort(function(x,y){return String(x.time||'').localeCompare(String(y.time||''));});
      });
      navigate('#/schedule?day='+day2);return;}

    // --- itinerary edits (before data-nav, since picker rows sit inside nav-able cards) ---
    var padd=e.target.closest&&e.target.closest('[data-padd]');
    if(padd){e.preventDefault();e.stopPropagation();
      var a=padd.getAttribute('data-padd').split(':');
      planAdd(a[0],a[1],a.slice(2).join(':'));router();return;}
    var padd2=e.target.closest&&e.target.closest('[data-padd2]');
    if(padd2){e.preventDefault();e.stopPropagation();
      var b=padd2.getAttribute('data-padd2').split(':');var day=b[0],t=b[1],id=b.slice(2).join(':');
      var idx=planFor(day).map(function(x){return x.t+':'+x.id;}).indexOf(t+':'+id);
      if(idx>=0)planRemove(day,idx);else planAdd(day,t,id);
      router();return;}
    var pmv=e.target.closest&&e.target.closest('[data-pmove]');
    if(pmv){e.preventDefault();e.stopPropagation();
      var m=pmv.getAttribute('data-pmove').split(':');planMove(m[0],+m[1],+m[2]);router();return;}
    var prm=e.target.closest&&e.target.closest('[data-premove]');
    if(prm){e.preventDefault();e.stopPropagation();
      var r2=prm.getAttribute('data-premove').split(':');planRemove(r2[0],+r2[1]);router();return;}
    var pcl=e.target.closest&&e.target.closest('[data-pclear]');
    if(pcl){e.preventDefault();e.stopPropagation();
      var p=plan();delete p[pcl.getAttribute('data-pclear')];savePlan(p);router();return;}

    var nav=e.target.closest&&e.target.closest('[data-nav]');
    if(nav){e.preventDefault();navigate(nav.getAttribute('data-nav'));return;}
  });
  backBtn.addEventListener('click',function(){history.length>1?history.back():navigate('#/');});
  window.addEventListener('hashchange',router);

  // refresh button (delegated — the More view is re-rendered on every route change)
  document.addEventListener('click',function(e){
    var rb=e.target.closest&&e.target.closest('#refreshBtn');
    if(rb){e.preventDefault();hardRefresh(rb);}
  });

  // service worker + update detection
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        // a worker already waiting means fresh files are ready to take over
        if(reg.waiting&&navigator.serviceWorker.controller)showUpdateBanner();
        reg.addEventListener('updatefound',function(){
          var nw=reg.installing;if(!nw)return;
          nw.addEventListener('statechange',function(){
            if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdateBanner();
          });
        });
        // Check for a new version on load, and on re-open — but at most every 15 min,
        // so flipping in and out of the app doesn't fire a request each time.
        var lastCheck=0;
        function maybeCheck(){
          var now=Date.now();
          if(now-lastCheck<900000)return;
          lastCheck=now;reg.update().catch(function(){});
        }
        maybeCheck();
        document.addEventListener('visibilitychange',function(){
          if(!document.hidden)maybeCheck();
        });
      }).catch(function(){});
    });
    // the worker tells us when a background revalidation found newer content
    navigator.serviceWorker.addEventListener('message',function(e){
      if(e.data==='CONTENT_UPDATED')showUpdateBanner();
    });
  }

  router();
  loadWeather();
})();
</script>
</body>
</html>
